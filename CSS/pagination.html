<html>
<head>
    <title>My Pagination Webpage</title>
  <style>
.pagination a{

  color:green;
  float:left;
  padding: 8px 16px;

}

  </style>
</head>

<body>
 
  <h1> Simple Pagination</h1>
  <div class="pagination">
    <a href="#">&laquo; Previous</a>  <!-- &laquo; represents a functional navigation link on a website that points to a prior page or item in a sequence.-->
    <a href="#">1</a>    <!--<a> tag with the attributes href="#"  represents a hyperlink typically used as a placeholder -->
    <a href="#" class="active">2</a>     <!--current selected page -->
    <a href="#">3</a>
    <a href="#">4</a>
    <a href="#">Next &raquo;</a> <!-- &raquo;HTML entity that represents the right-pointing double angle quotation mark (»).-->
  </div>

</body>
</html>
